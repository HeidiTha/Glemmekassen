<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glemmekassen – Skriv inn koden</title>
<meta name="theme-color" content="#FAF8F4">
<!-- glemmekassen.com/kode – eieren taster koden fra SMS-en og kommer til eiersiden (../eier.html?kode=…).
     Nye koder er 4 bokstaver (BTKS). Eldre koder (482915 og K7M4Q2) virker også. -->
<style>
@font-face{font-family:Nunito;src:url(../felles/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{--bg:#FAF8F4;--navy:#1F3A5F;--linje:#E6E1D8;--ramme:#CFC8BB;--gul:#E8B54D;--feil:#A13A1C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Nunito,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{max-width:440px;margin:0 auto;min-height:100dvh;padding:20px 24px calc(120px + env(safe-area-inset-bottom));position:relative}
.topp{display:flex;align-items:center;justify-content:space-between;height:48px}
.tilbake{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px;border-radius:12px}
.tilbake:focus-visible,.btn:focus-visible{outline:3px solid var(--gul);outline-offset:2px}
.topp img{width:30px;height:auto}
h1{margin:40px 0 0;font-size:26px;font-weight:800;line-height:1.2}
.felt{position:relative;margin-top:28px}
.ruter{display:grid;grid-template-columns:repeat(var(--antall,4),minmax(0,1fr));gap:12px}
.ruter span{height:72px;border-radius:14px;background:#fff;border:1.5px solid var(--ramme);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.ruter.mange{gap:8px}.ruter.mange span{height:62px;font-size:26px}
.ruter span.her{border-color:var(--navy)}
/* Selve feltet ligger usynlig over rutene, så ett trykk hvor som helst på rutene åpner tastaturet */
#kode{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent}
.felt:focus-within .ruter span.her{box-shadow:0 0 0 3px rgba(232,181,77,.55)}
.feil{color:var(--feil);font-weight:700;font-size:15px;line-height:1.4;margin:14px 0 0;min-height:1.4em}
.bunn{position:fixed;left:0;right:0;bottom:0;padding:0 24px calc(40px + env(safe-area-inset-bottom));background:linear-gradient(rgba(250,248,244,0),var(--bg) 30%)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;max-width:392px;margin:0 auto;height:58px;border-radius:18px;border:0;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.btn:disabled{opacity:.6}
.skjult{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style></head><body><main>
<div class="topp">
  <a class="tilbake" href="../hittegods.html" aria-label="Tilbake til forsiden"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
  <img src="../felles/ikon-lys.png" alt="Glemmekassen">
</div>

<h1>Skriv inn koden fra SMS-en</h1>

<form id="skjema" novalidate>
  <div class="felt">
    <label class="skjult" for="kode">Koden fra SMS-en</label>
    <div class="ruter" id="ruter" aria-hidden="true"></div>
    <input id="kode" name="kode" type="text" inputmode="text" autocapitalize="characters" autocomplete="one-time-code" autocorrect="off" spellcheck="false" maxlength="6" required>
  </div>
  <p class="feil" id="feil" role="alert"></p>
  <div class="bunn"><button class="btn" id="knapp" type="submit">Se plagget ditt</button></div>
</form>
</main><script>
const API = 'https://jyajkriknplrhsxustpf.supabase.co/functions/v1/glemmekassen-sms';
const felt = document.getElementById('kode'), feil = document.getElementById('feil'), knapp = document.getElementById('knapp');
const ruter = document.getElementById('ruter');
const rens = v => v.toUpperCase().replace(/[^A-Z0-9]/g, '');
// Nye koder: 4 bokstaver. Eldre koder: 6 siffer eller 6 bokstaver og tall.
const gyldig = k => /^[A-Z]{4}$/.test(k) || /^[0-9]{6}$/.test(k) || /^[A-Z0-9]{6}$/.test(k);

// Rutene viser det som er skrevet. Fire ruter, og flere hvis noen skriver en eldre kode på 6 tegn.
function tegnRuter() {
  const k = rens(felt.value).slice(0, 6);
  if (felt.value !== k) felt.value = k;
  const vis = k.length > 4 ? 6 : 4;
  ruter.style.setProperty('--antall', vis);
  ruter.classList.toggle('mange', vis > 4);
  const bokser = [];
  for (let i = 0; i < vis; i++) {
    const s = document.createElement('span');
    s.textContent = k[i] || '';
    if (i === Math.min(k.length, vis - 1)) s.className = 'her';
    bokser.push(s);
  }
  ruter.replaceChildren(...bokser);
}
felt.addEventListener('input', () => { feil.textContent = ''; tegnRuter(); });

// En lenke som glemmekassen.com/kode/?k=BTKS fyller inn koden og åpner funnet direkte
const fraLenke = rens(new URLSearchParams(location.search).get('k') || '').slice(0, 6);
felt.value = fraLenke;
tegnRuter();
if (gyldig(fraLenke)) setTimeout(() => sendInn(), 0); else felt.focus();

const sendInn = () => document.getElementById('skjema').dispatchEvent(new Event('submit', { cancelable: true }));
document.getElementById('skjema').addEventListener('submit', async (e) => {
  e.preventDefault();
  const kode = rens(felt.value);
  if (!gyldig(kode)) { feil.textContent = 'Koden har 4 bokstaver, for eksempel BTKS.'; felt.focus(); return; }
  if (knapp.disabled) return;
  knapp.disabled = true; knapp.textContent = 'Leter …';
  try {
    const res = await fetch(API + '?kode=' + encodeURIComponent(kode), { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Noe gikk galt. Prøv igjen.');
    location.href = '../eier.html?kode=' + encodeURIComponent(kode);
  } catch (err) {
    feil.textContent = err.message === 'Failed to fetch' ? 'Får ikke kontakt. Sjekk nettet og prøv igjen.' : err.message;
    knapp.disabled = false; knapp.textContent = 'Se plagget ditt'; felt.focus();
  }
});
</script></body></html>
