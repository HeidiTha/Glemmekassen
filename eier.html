<!doctype html>
<html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Glemmekassen – Ditt funn</title>
<meta name="theme-color" content="#FAF8F4"><meta name="referrer" content="no-referrer">
<!-- Eiersiden. Åpnes fra lenken i SMS-en (k/?KODE), fra glemmekassen.com/kode (eier.html?kode=…) eller fra gamle SMS-lenker (eier.html?id=…). -->
<style>
@font-face{font-family:Nunito;src:url(felles/nunito.woff2) format('woff2');font-weight:200 1000;font-display:swap}
:root{--bg:#FAF8F4;--navy:#1F3A5F;--linje:#E6E1D8;--ramme:#CFC8BB;--gul:#E8B54D;--myk-gul:#FBF1DC;--myk-bla:#EEF3F8;--bildebakgrunn:#E9E4DA;--feil:#A13A1C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:Nunito,system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{max-width:440px;margin:0 auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 24px calc(130px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--gul);outline-offset:2px}
a{color:var(--navy)}
.topp{display:flex;align-items:center;justify-content:space-between;height:48px}
.topp.hoyre{justify-content:flex-end}
.tilbake{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-left:-10px;border-radius:12px}
.topp img{width:30px;height:auto}
h1{margin:16px 0;font-size:26px;font-weight:800;line-height:1.2}
.photo{height:240px;border-radius:20px;background:var(--bildebakgrunn);display:flex;justify-content:center;align-items:center;overflow:hidden;text-align:center;font-size:15px;font-weight:700}
.photo img{width:100%;height:100%;object-fit:contain}
.sted{display:flex;gap:14px;align-items:flex-start;margin-top:20px}
.sted svg{flex-shrink:0;margin-top:2px}
.sted div{display:flex;flex-direction:column;gap:2px}
.sted strong{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.sted span{font-size:15px;font-weight:600}
.kart{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;height:54px;border-radius:16px;background:var(--myk-bla);border:1px solid var(--linje);font-size:16px;font-weight:800;text-decoration:none}
.kart[aria-disabled=true]{opacity:.55;pointer-events:none}
.bunn{position:fixed;left:0;right:0;bottom:0;padding:16px 24px calc(40px + env(safe-area-inset-bottom));background:linear-gradient(rgba(250,248,244,0),var(--bg) 22%)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:392px;margin:0 auto;height:58px;border-radius:18px;border:0;background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800;text-decoration:none;cursor:pointer}
.btn.lys{background:#fff;color:var(--navy);border:1.5px solid var(--ramme)}
.btn:disabled{opacity:.55}
.feil{color:var(--feil);font-size:15px;font-weight:700;line-height:1.45;margin-top:14px}
.midt{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:min(110px,10dvh);gap:16px}
.rund{width:88px;height:88px;border-radius:50%;background:var(--myk-gul);display:flex;align-items:center;justify-content:center}
.midt h1{margin:8px 0 0;font-size:28px}
</style></head><body><main>

<!-- Funnet -->
<section id="funn">
  <div class="topp">
    <a class="tilbake" href="kode/" aria-label="Tilbake"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <img src="felles/ikon-lys.png" alt="Glemmekassen">
  </div>
  <h1 id="tittel">Noen har funnet noe som kan være ditt</h1>
  <div class="photo" id="photo"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#8A97A6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5L6 5 3.5 9l2 1.5L7 9v11.5h10V9l1.5 1.5 2-1.5L18 5l-3-1.5c-.5 1.4-1.6 2.2-3 2.2s-2.5-.8-3-2.2z"/></svg></div>
  <div class="sted" id="sted-rad">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F3A5F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
    <div><strong id="place">Laster …</strong><span id="meta"></span></div>
  </div>
  <a class="kart" id="map" href="#" aria-disabled="true" target="_blank" rel="noopener">Åpne kart</a>
  <div class="feil" id="feil" role="alert" hidden></div>
  <div class="bunn">
    <button class="btn" id="hentet" type="button" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="hentet-tekst">Jeg har hentet den</span></button>
    <a class="btn" id="prov-igjen" href="kode/" hidden>Skriv inn koden på nytt</a>
  </div>
</section>

<!-- Takk – vises når eieren har trykket «Jeg har hentet den» -->
<section id="takk" hidden>
  <div class="topp hoyre"><img src="felles/ikon-lys.png" alt="Glemmekassen"></div>
  <div class="midt">
    <span class="rund"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1F3A5F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-9.6A4 4 0 0 1 12 8a4 4 0 0 1 7 2.4C19 15.6 12 20 12 20z"/></svg></span>
    <h1 id="takk-tittel">Så fint at den kom hjem!</h1>
  </div>
  <div class="bunn"><a class="btn lys" href="hittegods.html">Til forsiden</a></div>
</section>
</main><script>
const API = 'https://jyajkriknplrhsxustpf.supabase.co/functions/v1/glemmekassen-sms';
const BILDE_PREFIX = 'https://jyajkriknplrhsxustpf.supabase.co/storage/v1/object/public/bilder/';
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const kode = (params.get('kode') || '').toUpperCase().replace(/[\s-]/g, '');
const id = params.get('id') || '';

// «Så fint at jakken kom hjem!» – bestemt form av hver kategori
const BESTEMT = { 'jakke':'jakken', 'genser':'genseren', 'bukse':'buksen', 'sko':'skoene', 'sekk':'sekken',
  'lue/skjerf':'plagget', 'sportsutstyr':'utstyret', 'vannflaske':'vannflasken', 'annet':'gjenstanden' };
// «Noen har funnet jakken din» – din/ditt/dine etter kategorien
const DIN = { 'sko':'dine', 'lue/skjerf':'ditt', 'sportsutstyr':'ditt' };
// «Jeg har hentet den/dem/det»
const DEN = { 'sko':'dem', 'lue/skjerf':'det', 'sportsutstyr':'det' };

function visFeil(tekst) { $('feil').textContent = tekst; $('feil').hidden = false; }

// «Funnet i dag kl. 14:12», «Funnet i går kl. 14:12» eller «Funnet 12. oktober kl. 14:12»
function nårFunnet(iso) {
  const d = new Date(iso); if (isNaN(d)) return '';
  const kl = d.toLocaleTimeString('nb-NO', { hour: '2-digit', minute: '2-digit' });
  const iDag = new Date(); iDag.setHours(0,0,0,0);
  const dag = new Date(d); dag.setHours(0,0,0,0);
  const diff = Math.round((iDag - dag) / 86400000);
  const når = diff === 0 ? 'i dag' : diff === 1 ? 'i går' : d.toLocaleDateString('nb-NO', { day: 'numeric', month: 'long' });
  return `Funnet ${når} kl. ${kl}`;
}

function settBilde(boks, url) {
  if (!url || !String(url).startsWith(BILDE_PREFIX)) return;
  const img = document.createElement('img');
  img.src = url; img.alt = 'Bilde av gjenstanden';
  img.onerror = () => img.replaceWith(document.createTextNode('Bildet kunne ikke lastes inn'));
  boks.replaceChildren(img);
}

function visTakk(x) {
  $('takk-tittel').textContent = `Så fint at ${BESTEMT[x.gjenstand] || 'gjenstanden'} kom hjem!`;
  $('funn').hidden = true; $('takk').hidden = false; scrollTo(0, 0);
}

(async () => {
  if (!kode && !/^[0-9a-f-]{36}$/i.test(id)) { location.replace('kode/'); return; }
  try {
    const q = kode ? 'kode=' + encodeURIComponent(kode) : 'id=' + encodeURIComponent(id);
    const res = await fetch(API + '?' + q, { cache: 'no-store' });
    const data = await res.json();
    if (!res.ok || !data.item) throw new Error(data.error || 'Kunne ikke hente funnet.');
    const x = data.item;
    const g = String(x.gjenstand || 'annet');
    $('tittel').textContent = `Noen har funnet ${BESTEMT[g] || 'gjenstanden'} ${DIN[g] || 'din'}`;
    $('hentet-tekst').textContent = `Jeg har hentet ${DEN[g] || 'den'}`;
    $('place').textContent = x.stedsnavn || 'Stedet er ikke oppgitt';
    $('meta').textContent = nårFunnet(x.created_at);
    settBilde($('photo'), x.bilde_url);
    const lat = Number(x.lat), lng = Number(x.lng);
    if (x.lat != null && x.lng != null && Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
      $('map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(lat + ',' + lng);
      $('map').removeAttribute('aria-disabled');
    } else {
      $('map').hidden = true;
    }
    if (x.hentet_at) { visTakk(x); return; }
    $('hentet').disabled = false;
    $('hentet').onclick = async () => {
      $('hentet').disabled = true; $('hentet-tekst').textContent = 'Lagrer …';
      try {
        const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(kode ? { action: 'hentet', kode } : { action: 'hentet', id }) });
        const svar = await r.json();
        if (!r.ok) throw new Error(svar.error || 'Kunne ikke lagre.');
        visTakk(x);
      } catch (e) {
        $('hentet').disabled = false; $('hentet-tekst').textContent = `Jeg har hentet ${DEN[g] || 'den'}`;
        visFeil('Det gikk ikke å lagre akkurat nå. Prøv igjen om litt.');
      }
    };
  } catch (err) {
    $('tittel').textContent = 'Fant ikke funnet';
    $('sted-rad').hidden = true; $('photo').hidden = true; $('map').hidden = true;
    visFeil(err.message || 'Prøv igjen senere.');
    $('prov-igjen').hidden = false; $('hentet').hidden = true;
  }
})();
</script></body></html>
